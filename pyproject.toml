[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moveai-vcm"
version = "0.1.0"
description = "Real-time traffic graph updates and recovery strategies for MOVE-AI VCM"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
moveai-reschedule = "moveai_vcm.cli:main"

[tool.setuptools.packages.find]
include = ["moveai_vcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
